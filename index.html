<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://unpkg.com 'unsafe-inline'; img-src 'self' https://*.tile.openstreetmap.org https://unpkg.com data: blob: https:; connect-src 'self' https: wss:; font-src 'self' https: data:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <title>Tamale Market Finder</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Leaflet for maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Supabase JS client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <h1 class="logo">🛒 Tamale Market Finder</h1>
            <nav class="nav">
                <button class="nav-btn active" data-page="home">Find Products</button>
                <button class="nav-btn" data-page="trader">Trader Portal</button>
            </nav>
        </div>
    </header>

    <!-- HOME PAGE: Customer search + map -->
    <div id="page-home" class="page active">
        <div class="search-section">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search for a product... (e.g., yam, fabric, phone charger)" />
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Grains & Cereals">🌾 Grains & Cereals</option>
                    <option value="Meat & Livestock">🥩 Meat & Livestock</option>
                    <option value="Textiles & Smocks">🧵 Textiles & Smocks</option>
                    <option value="Electronics & Phones">📱 Electronics & Phones</option>
                    <option value="Hardware & Building">🔨 Hardware & Building</option>
                    <option value="Fresh Produce">🍎 Fresh Produce</option>
                    <option value="Pharmacy & Health">💊 Pharmacy & Health</option>
                    <option value="Cooked Food">🍳 Cooked Food</option>
                    <option value="Crafts & Artifacts">🎨 Crafts & Artifacts</option>
                    <option value="Cosmetics & Toiletries">🧴 Cosmetics & Toiletries</option>
                    <option value="Tools & Equipment">🛠️ Tools & Equipment</option>
                    <option value="General Goods">📦 General Goods</option>
                </select>
                <button id="searchBtn" class="btn-primary">Search</button>
            </div>
            <div class="market-filter">
                <label>Market Area:</label>
                <select id="marketFilter">
                    <option value="">All Markets</option>
                    <option value="Central Market">Tamale Central Market</option>
                    <option value="Aboabo Market">Aboabo Market</option>
                    <option value="Old Market">Old Market</option>
                    <option value="Lamashegu">Lamashegu</option>
                    <option value="Kukuo">Kukuo</option>
                    <option value="Other">Other Areas</option>
                </select>
            </div>
        </div>

        <div class="results-container">
            <div class="results-list" id="resultsList">
                <div class="empty-state">
                    <p>🔍 Search for a product to find shops near you in Tamale</p>
                </div>
            </div>
            <div class="map-container">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- TRADER PORTAL PAGE -->
    <div id="page-trader" class="page">
        <!-- Login/Register -->
        <div id="trader-auth" class="trader-auth">
            <div class="auth-card">
                <h2>Trader Portal</h2>
                <p>Create an account or sign in to manage your shop</p>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="login">Sign In</button>
                    <button class="tab-btn" data-tab="register">Register</button>
                </div>
                <div id="tab-login" class="tab-content active">
                    <input type="email" id="loginEmail" placeholder="Email" />
                    <input type="password" id="loginPassword" placeholder="Password" />
                    <button class="btn-primary" id="loginBtn">Sign In</button>
                </div>
                <div id="tab-register" class="tab-content">
                    <input type="text" id="regName" placeholder="Your Name" />
                    <input type="email" id="regEmail" placeholder="Email" />
                    <input type="password" id="regPassword" placeholder="Password" />
                    <button class="btn-primary" id="registerBtn">Create Account</button>
                </div>
                <p class="auth-note">Free to join. No fees.</p>
            </div>
        </div>

        <!-- Trader Dashboard (shown after login) -->
        <div id="trader-dashboard" class="trader-dashboard" style="display:none;">
            <div class="dashboard-header">
                <h2>My Shop</h2>
                <button class="btn-secondary" id="logoutBtn">Sign Out</button>
            </div>

            <!-- Shop Setup -->
            <div class="card" id="shop-setup-card">
                <h3>Shop Details</h3>
                <form id="shopForm">
                    <div class="form-row">
                        <input type="text" id="shopName" placeholder="Shop name *" required />
                    </div>
                    <div class="form-row">
                        <select id="shopCategory" required>
                            <option value="">Select category *</option>
                            <option value="Grains & Cereals">🌾 Grains & Cereals</option>
                            <option value="Meat & Livestock">🥩 Meat & Livestock</option>
                            <option value="Textiles & Smocks">🧵 Textiles & Smocks</option>
                            <option value="Electronics & Phones">📱 Electronics & Phones</option>
                            <option value="Hardware & Building">🔨 Hardware & Building</option>
                            <option value="Fresh Produce">🍎 Fresh Produce</option>
                            <option value="Pharmacy & Health">💊 Pharmacy & Health</option>
                            <option value="Cooked Food">🍳 Cooked Food</option>
                            <option value="Crafts & Artifacts">🎨 Crafts & Artifacts</option>
                            <option value="Cosmetics & Toiletries">🧴 Cosmetics & Toiletries</option>
                            <option value="Tools & Equipment">🛠️ Tools & Equipment</option>
                            <option value="General Goods">📦 General Goods</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <select id="shopMarketArea">
                            <option value="">Select market area</option>
                            <option value="Central Market">Tamale Central Market</option>
                            <option value="Aboabo Market">Aboabo Market</option>
                            <option value="Old Market">Old Market</option>
                            <option value="Lamashegu">Lamashegu</option>
                            <option value="Kukuo">Kukuo</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <input type="text" id="shopAddress" placeholder="Address / Landmark (e.g., near Aboabo junction)" />
                    </div>
                    <div class="form-row">
                        <input type="text" id="shopPhone" placeholder="Phone number" />
                    </div>
                    <div class="form-row">
                        <input type="text" id="shopHours" placeholder="Opening hours (e.g., 8am–6pm daily)" />
                    </div>
                    <div class="form-row">
                        <textarea id="shopDescription" placeholder="Short description of your shop"></textarea>
                    </div>
                    <div class="form-row location-row">
                        <button type="button" class="btn-secondary" id="getLocationBtn">📍 Use My Location</button>
                        <span id="locationStatus" class="location-status"></span>
                    </div>
                    <div class="form-row">
                        <input type="hidden" id="shopLat" />
                        <input type="hidden" id="shopLng" />
                    </div>
                    <button type="submit" class="btn-primary">Save Shop</button>
                </form>
            </div>

            <!-- Products Section -->
            <div class="card" id="products-card" style="display:none;">
                <div class="products-header">
                    <h3>My Products</h3>
                    <button class="btn-secondary" id="addProductBtn">+ Add Product</button>
                </div>
                <div id="productsList" class="products-list"></div>
            </div>

            <!-- Add Product Form (modal-like) -->
            <div class="card" id="product-form-card" style="display:none;">
                <h3 id="productFormTitle">Add Product</h3>
                <form id="productForm">
                    <input type="hidden" id="productId" />
                    <div class="form-row">
                        <input type="text" id="productName" placeholder="Product name *" required />
                    </div>
                    <div class="form-row">
                        <select id="productCategory">
                            <option value="">Category (optional)</option>
                            <option value="Grains & Cereals">🌾 Grains & Cereals</option>
                            <option value="Meat & Livestock">🥩 Meat & Livestock</option>
                            <option value="Textiles & Smocks">🧵 Textiles & Smocks</option>
                            <option value="Electronics & Phones">📱 Electronics & Phones</option>
                            <option value="Hardware & Building">🔨 Hardware & Building</option>
                            <option value="Fresh Produce">🍎 Fresh Produce</option>
                            <option value="Pharmacy & Health">💊 Pharmacy & Health</option>
                            <option value="Cooked Food">🍳 Cooked Food</option>
                            <option value="Crafts & Artifacts">🎨 Crafts & Artifacts</option>
                            <option value="Cosmetics & Toiletries">🧴 Cosmetics & Toiletries</option>
                            <option value="Tools & Equipment">🛠️ Tools & Equipment</option>
                            <option value="General Goods">📦 General Goods</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <input type="number" id="productPrice" placeholder="Price (GHS)" step="0.01" />
                    </div>
                    <div class="form-row">
                        <textarea id="productDescription" placeholder="Product description"></textarea>
                    </div>
                    <div class="form-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="productInStock" checked /> In Stock
                        </label>
                    </div>
                    <div class="form-row">
                        <input type="file" id="productImage" accept="image/*" />
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="btn-primary">Save Product</button>
                        <button type="button" class="btn-secondary" id="cancelProductBtn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Shop Detail Modal -->
    <div id="shopModal" class="modal" style="display:none;">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer class="footer">
        <p>Tamale Market Finder — Connecting buyers and traders in Northern Ghana</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
